name: Contract

# Compares the mock with real Discord on the test guild. Kept out of CI so a Discord
# outage or rate limit can't block main.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      update_baseline:
        description: "Rewrite contract/baseline.json from this run (download it from the artifact)"
        type: boolean
        default: false

concurrency:
  group: contract
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:contract
        env:
          DISCORD_CONTRACT_TOKEN: ${{ secrets.DISCORD_CONTRACT_TOKEN }}
          DISCORD_CONTRACT_GUILD: "1572343051337342976"
          UPDATE_BASELINE: ${{ inputs.update_baseline && '1' || '' }}
      # The test log cuts long output; print the differences (shapes only, no values) whole, so
      # the baseline can be read without downloading the artifact.
      - if: always()
        run: |
          [ -f contract/report.json ] && jq -c '{statusDifferences, differences}' contract/report.json || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-report
          path: |
            contract/report.json
            contract/baseline.json
          if-no-files-found: ignore
